<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Instrutor · Cavalaria SD</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,400;1,700&family=Rye&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<!-- Página restrita aos instrutores: sem menu, protegida por senha. -->
<body data-page="painel" data-isolada>
<div class="sheet">
<main>

  <section class="hero">
    <span class="kicker">Uso Restrito</span>
    <h2>Painel do Instrutor</h2>
    <p class="hero-sub">Prova de Conhecimento</p>
    <span data-ornament></span>
  </section>

  <form id="entrar" class="cofre">
    <label for="senha">Senha do instrutor</label>
    <div class="cofre-linha">
      <input type="password" id="senha" autocomplete="current-password" required>
      <button type="submit" class="btn-enviar">Entrar</button>
    </div>
    <p id="entrar-erro" class="notice" hidden></p>
  </form>

  <section id="painel" hidden>
    <div class="painel-topo">
      <div class="telegram" data-label="AGENDA DA PROVA"><p id="agenda"></p></div>
      <p class="painel-acoes">
        <button type="button" class="btn-sec" id="atualizar">Atualizar</button>
        <button type="button" class="btn-sec" id="sair">Sair</button>
      </p>
    </div>

    <div class="placar" id="placar"></div>

    <h3 class="section">Acertos por tópico</h3>
    <div class="topicos" id="topicos"></div>

    <h3 class="section">Oficiais avaliados</h3>
    <div class="filtros">
      <input type="search" id="busca" placeholder="Buscar por nome, ID ou patente">
      <select id="filtro">
        <option value="todos">Todos</option>
        <option value="aprovados">Aprovados</option>
        <option value="reprovados">Reprovados</option>
      </select>
    </div>
    <div class="table-wrap">
      <table class="tabela-oficiais">
        <thead><tr><th>Oficial</th><th>ID</th><th>Patente</th><th>Enviado em</th><th style="text-align:right">Acertos</th><th style="text-align:right">Nota</th><th>Resultado</th></tr></thead>
        <tbody id="oficiais"></tbody>
      </table>
    </div>
    <p id="vazio" class="telegram" data-label="AVISO" hidden>Nenhuma prova encontrada.</p>
  </section>

</main>
</div>
<script src="js/layout.js"></script>
<script src="js/prova-data.js"></script>
<script src="js/agenda.js"></script>
<script src="js/painel.js"></script>
</body>
</html>
